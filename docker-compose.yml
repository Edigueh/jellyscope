# Local-dev compose file. HF Space deploys via Dockerfile directly and does not use this file.
# Image is version-tagged from pyproject.toml; pass JELLYSCOPE_VERSION via the just recipes.

services:
  jellyscope:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JELLYSCOPE_VERSION: "${JELLYSCOPE_VERSION:-dev}"
    image: jellyscope:${JELLYSCOPE_VERSION:-dev}
    container_name: jellyscope
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data:ro
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
