services:
  jellyscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: jellyscope:latest
    container_name: jellyscope
    ports:
      - "5000:5000"
    volumes:
      - jellyscope-data:/data:ro
    environment:
      JELLYSCOPE_ENABLE_SED: "${JELLYSCOPE_ENABLE_SED:-false}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  jellyscope-data:
    name: jellyscope-data
