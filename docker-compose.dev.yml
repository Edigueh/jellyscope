services:
  jellyscope:
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    working_dir: /app
    entrypoint: ["uvicorn"]
    command:
      - "jellyscope.web:create_app"
      - "--factory"
      - "--host=0.0.0.0"
      - "--port=5000"
      - "--reload"
      - "--reload-dir=/app/src"
    healthcheck:
      disable: true
