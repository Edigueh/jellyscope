# Dev override layered on top of docker-compose.yml via `just docker-dev`.
#
# Why the entrypoint is replaced: the `jellyscope` console script does not expose
# a --reload flag, and uvicorn auto-reload requires invoking uvicorn directly with
# --reload-dir. Source is bind-mounted read-only so edits trigger reload without rebuild.

services:
  jellyscope:
    volumes:
      - ./src:/app/src:ro
    entrypoint: ["uvicorn"]
    command:
      - "jellyscope.web:create_app"
      - "--factory"
      - "--host=0.0.0.0"
      - "--port=5000"
      - "--reload"
      - "--reload-dir=/app/src"
    healthcheck:
      disable: true
