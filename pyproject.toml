[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyscope"
version = "0.1.0"
description = "Interactive visualization of JWST jellyfish galaxy datacubes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "André Schaidhauer Luckmann"},
]
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "plotly>=5.18",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy>=1.8",
    "pandas-stubs",
    "pre-commit",
    "codespell",
    "httpx>=0.27",
]

[project.scripts]
jellyscope = "jellyscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
]
ignore = [
    "S101",   # assert — used legitimately in tests
    "RET504", # unnecessary assignment before return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts are the point of tests
    "ARG",    # fixtures appear as unused arguments
    "T20",    # print in tests is fine
    "S104",   # binding to all interfaces fine in tests
    "S311",   # pseudo-random generators fine in tests
]
"src/jellyscope/cli.py" = [
    "T201",   # print is the CLI output mechanism
]
"src/jellyscope/web/routes.py" = [
    "ARG001", # FastAPI path/query params sometimes appear unused
]

[tool.ruff.lint.isort]
known-first-party = ["jellyscope"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=jellyscope",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "astropy.*",
    "plotly.*",
    "scipy.*",
    "uvicorn",
]
ignore_missing_imports = true

[tool.codespell]
skip = "*.fits,*.csv,*.lock,*.js,*.css,.git,htmlcov"
ignore-words-list = "nd,astropy"
