[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyscope"
version = "0.1.0"
description = "Interactive visualization of JWST jellyfish galaxy datacubes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "André Schaidhauer Luckmann"},
]
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "flask>=3.0",
    "plotly>=5.18",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
jellyscope = "jellyscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
