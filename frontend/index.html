<!doctype html>

  `vite` (dev) and `vite build` have an HTML input; it mirrors the mount points
  the real template provides, with a stubbed bootstrap for standalone dev.
-->

        "filters": ["F090W", "F115W", "F150W", "F200W", "F277W", "F356W", "F444W", "F200W"],
        "wavelengths": { "F090W": 0.9, "F115W": 1.154, "F150W": 1.501, "F200W": 1.99, "F277W": 2.786, "F356W": 3.563, "F444W": 4.421 }

  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
